[package]
name = "chemmind-backend"
version = "0.1.0"
edition = "2021"
description = "ChemMind Backend - Fast, local, production-grade Rust API"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
axum-extra = { version = "0.9", features = ["multipart"] }
tokio = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.5"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
sqlx-postgres = "0.8"

# Authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Configuration
config = { version = "0.14", features = ["ini"] }
dotenvy = "0.15"

# Validation
validator = { version = "0.17", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
tracing-appender = "0.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
futures = "0.3"
mime = "0.3"
mime_guess = "2.0"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"

# File handling
tokio-util = { version = "0.7", features = ["io", "compat", "codec"] }

# AI/HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws", "multipart"] }

[build-dependencies]
sqlx = { version = "0.8", features = ["postgres", "migrate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = true